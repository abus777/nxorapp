name: iOS build & screenshots

on:
  push:
    branches: [main, v1-app]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for simulator
        id: build
        run: |
          set +e
          xcodebuild -project NXOR.xcodeproj -target NXOR -configuration Debug \
            -sdk iphonesimulator SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          mkdir -p out
          grep -E "error:|warning: .*(deprecated|unused)" build.log | sort -u > out/errors.txt || true
          tail -60 build.log > out/build-tail.log
          xcodebuild -version > out/xcode.txt

      - name: Run in simulator and take screenshots
        if: steps.build.outputs.status == '0'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for r, v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')]
          pref = [x for x in phones if 'Pro' in x['name'] and 'Max' not in x['name']] or phones
          print(sorted(pref, key=lambda x: x['name'])[-1]['udid'])")
          xcrun simctl list devices | grep "$UDID" > out/device.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/NXOR.app
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.abus777.nxorapp 2>/dev/null || true
            xcrun simctl launch --stdout="$PWD/out/$name.stdout.txt" --stderr="$PWD/out/$name.stderr.txt" "$UDID" com.abus777.nxorapp "$@" > /dev/null
            sleep 14
            xcrun simctl io "$UDID" screenshot "out/$name.png"
            for retry in 1 2 3; do
              [ "$(stat -f%z "out/$name.png")" -gt 120000 ] && break
              sleep 6
              xcrun simctl io "$UDID" screenshot "out/$name.png"
            done
            if [ "$name" = "03-drawer-chat" ]; then
              PID=$(pgrep -f "NXOR.app/NXOR" | head -1)
              [ -n "$PID" ] && sample "$PID" 3 -file "out/$name.sample.txt" >/dev/null 2>&1 || true
            fi
            if xcrun simctl spawn "$UDID" launchctl list | grep -q com.abus777.nxorapp; then echo "$name alive" >> out/alive.txt; else echo "$name DEAD" >> out/alive.txt; fi
          }
          shot 01-signin
          shot 02-chat-home -demo YES
          shot 03-drawer-chat -demo YES -sidebar YES
          shot 04-drawer-studio -demo YES -route studio -sidebar YES
          shot 05-chat-card -demo YES -chat c1
          shot 06-chat-prompt -demo YES -chat c2
          shot 07-chat-result -demo YES -chat c3
          shot 08-move-to-project -demo YES -chat c3 -sheet move
          shot 09-studio -demo YES -route studio
          shot 10-create-sheet -demo YES -route studio -sheet create
          shot 11-studio-from-chat -demo YES -route studio -sheet fromChat
          shot 12-presets -demo YES -route studio -push presets
          shot 13-preset-category -demo YES -route studio -push category:product
          shot 14-result -demo YES -route studio -push result:first
          shot 15-projects -demo YES -route projects
          shot 16-new-project -demo YES -route projects -sheet newProject
          shot 17-project-chats -demo YES -push project
          shot 18-project-media -demo YES -route studio -push project:studio
          shot 19-project-chat -demo YES -push projectChat:p1
          shot 20-project-new-chat -demo YES -push newProjectChat
          shot 21-account -demo YES -push account
          shot 22-credits -demo YES -sheet credits
          shot 23-plans -demo YES -sheet plans
          shot 24-notify -demo YES -chat c3 -sheet notify
          shot 25-offline -demo YES -chat c3 -offline YES
          shot 26-moderation -demo YES -chat c7
          shot 27-light-studio -demo YES -route studio -appearance light
          shot 28-photos-denied -demo YES -sheet photos
          shot 29-preset-detail -demo YES -route studio -push presets -preset neon-noir-relight
          mkdir -p out/crashes
          find ~/Library/Logs/DiagnosticReports -name 'NXOR*' -newer build.log -exec cp {} out/crashes/ \; 2>/dev/null || true
          find out -name '*.std*.txt' -size 0 -delete
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "NXOR"' --style compact 2>/dev/null | grep -iE "fault|error|crash" | tail -40 > out/runtime-errors.txt || true

      - name: Publish results to ci-results branch
        if: always()
        run: |
          echo "commit=${GITHUB_SHA}" > out/status.txt
          echo "build_status=${{ steps.build.outputs.status }}" >> out/status.txt
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> out/status.txt
          cd out
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
